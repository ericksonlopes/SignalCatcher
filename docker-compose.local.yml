# Overlay: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
# Requires Docker Compose >= 2.24.4 for !override.
services:
  demograph-storage-init:
    volumes: !override
      - ./youtube:/youtube
      - ./demograph:/demograph

  migrate:
    volumes: !override
      - ./youtube:/youtube
      - ./demograph:/demograph

  worker:
    volumes: !override
      - ./youtube:/youtube
      - ./demograph:/demograph

  app:
    volumes: !override
      - ./youtube:/youtube
      - ./demograph:/demograph
    ports: !override
      - "8000:8000"

  demograph-worker:
    volumes: !override
      - ./youtube:/youtube
      - ./demograph:/demograph

  frontend:
    build:
      context: ../SignalCatcherFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shared_postgres_network
