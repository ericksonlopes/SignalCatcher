# Standalone Portainer stack using Docker-managed volumes instead of SSD bind mounts.
# Set DEMOGRAPH_NEO4J_PASSWORD; set DEMOGRAPH_NEO4J_HOST for access from the LAN.
services:
  demograph-neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    stop_grace_period: 120s
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${DEMOGRAPH_NEO4J_PASSWORD:?Configure DEMOGRAPH_NEO4J_PASSWORD}"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_advertised__address: "${DEMOGRAPH_NEO4J_HOST:-demograph-neo4j}:7687"
      NEO4J_server_http_advertised__address: "${DEMOGRAPH_NEO4J_HOST:-demograph-neo4j}:7474"
      NEO4J_server_memory_heap_initial__size: "256M"
      NEO4J_server_memory_heap_max__size: "${DEMOGRAPH_NEO4J_HEAP:-512M}"
      NEO4J_server_memory_pagecache_size: "${DEMOGRAPH_NEO4J_PAGECACHE:-512M}"
    mem_limit: "${DEMOGRAPH_NEO4J_MEMORY_LIMIT:-2g}"
    volumes:
      - "neo4j_data:/data"
      - "neo4j_logs:/logs"
      - "neo4j_import:/import"
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1;" >/dev/null 2>&1'
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      signalcatcher:
        aliases:
          - demograph-neo4j

networks:
  signalcatcher:
    external: true
    name: "${SIGNALCATCHER_NETWORK:-signalcatcher_network}"

# Stored beneath the Docker data root; do not delete these volumes on redeploy.
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
