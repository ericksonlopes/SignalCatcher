services:
  app:
    build: .
    container_name: signalcatcher_app
    restart: unless-stopped
    ports:
      - "5001:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Aponta para o nome do container do Postgres na outra stack
      POSTGRES_HOST: ${POSTGRES_HOST-postgresql}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE-signalcatcher}
      LIST_LOG_LEVELS: ${LIST_LOG_LEVELS:-ERROR,WARNING,INFO}
      VOICE_MONKEY_API_TOKEN: ${VOICE_MONKEY_API_TOKEN:-}
      VOICE_MONKEY_NEW_VIDEO_FOR_DOWNLOAD_MONKEY_ID: ${VOICE_MONKEY_NEW_VIDEO_FOR_DOWNLOAD_MONKEY_ID:-}
      DOWNLOAD_YOUTUBE_PATH: /app/youtube_downloads
      DIARIZATION_API_URL: ${DIARIZATION_API_URL:-http://localhost:8001}
      # Browser origins allowed to call the API. The image no longer defaults to "*",
      # so a frontend on another host has to be listed here.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Left empty on purpose: the image installs ffmpeg on PATH, and yt-dlp finds it.
      FFMPEG_LOCATION: ${FFMPEG_LOCATION:-}
    volumes:
      # Host directory that receives the downloads. It used to be hardcoded to one
      # machine's mount point, which made the file unusable anywhere else.
      - ${DOWNLOADS_HOST_PATH:-./youtube_downloads}:/app/youtube_downloads
    networks:
      - shared_postgres_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # /status exists for exactly this purpose and was not being used.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run before the server starts, so allow time before counting failures.
      start_period: 40s

networks:
  shared_postgres_network:
    external: true
    name: signalcatcher_network
