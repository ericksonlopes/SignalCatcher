services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demograph_test
      POSTGRES_PASSWORD: demograph_test_only
      POSTGRES_DB: demograph_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demograph_test -d demograph_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/demograph_test_only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1::7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
